<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Min gode vaner</title>
<meta name="description" content="Små handlinger tæller. Sæt flueben ved dine vaner hver dag.">
<meta name="theme-color" content="#17241c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gode vaner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  [hidden] { display: none !important; }
  /* Layout: one narrow column like a phone app — today's card with one-tap habits on top, then dashboard, dot calendar, habit settings and backup */
  :root {
    --bg: #eef1ec;        /* pale lichen (same family as Spirekassen) */
    --surface: #ffffff;
    --line: #d6ddd3;
    --ink: #17241c;       /* deep spruce */
    --muted: #5d6b61;
    --sprout: #2f7d4f;    /* new-leaf green */
    --sprout-ink: #ffffff;
    --flame: #d9822b;     /* streak glow */
    --danger: #c9503f;
    /* habit colours for light surfaces */
    --c0: #6f62c0; --c1: #d8634b; --c2: #c98d12; --c3: #3a9660; --c4: #2f86b8; --c5: #c0558a;
    /* habit colours on the inverted day card (deep tones read on both the dark and the light card) */
    --d0: #8b7fe0; --d1: #e5765d; --d2: #d9a032; --d3: #47ad70; --d4: #4a9fd0; --d5: #d56fa1;
    --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --font-body: Figtree, ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101713; --surface: #18221c; --line: #2a3830; --ink: #e6ede7;
      --muted: #9aa99f; --sprout: #5cc187; --sprout-ink: #0d1a12; --flame: #f0a050; --danger: #e8705f;
      --c0: #a397ec; --c1: #f08a72; --c2: #e8b54e; --c3: #5cc187; --c4: #6bb5e0; --c5: #e48ab6;
      --d0: #6a5cc0; --d1: #cf5a41; --d2: #b8840e; --d3: #2f8a55; --d4: #2c7fae; --d5: #b54d80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101713; --surface: #18221c; --line: #2a3830; --ink: #e6ede7;
    --muted: #9aa99f; --sprout: #5cc187; --sprout-ink: #0d1a12; --flame: #f0a050; --danger: #e8705f;
    --c0: #a397ec; --c1: #f08a72; --c2: #e8b54e; --c3: #5cc187; --c4: #6bb5e0; --c5: #e48ab6;
    --d0: #6a5cc0; --d1: #cf5a41; --d2: #b8840e; --d3: #2f8a55; --d4: #2c7fae; --d5: #b54d80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: default; opacity: .35; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--sprout); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .label { letter-spacing: .06em; text-transform: uppercase; font-size: 11px; font-weight: 600; color: var(--muted); }

  .wrap { max-width: 28rem; margin: 0 auto; padding-block: 24px 96px; display: flex; flex-direction: column; gap: 28px; }

  /* header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .top h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
  .sub { color: var(--muted); margin-top: 2px; }
  .theme-btn {
    flex-shrink: 0; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center;
  }

  /* today card (inverted, like Spirekassen's week card) */
  .day { background: var(--ink); color: var(--bg); border-radius: 28px; padding: 18px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .day-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 4px; text-align: center; }
  .nav { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 22px; line-height: 1; }
  .day .nav { background: color-mix(in srgb, var(--bg) 10%, transparent); }
  .kicker { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; font-weight: 600; opacity: .7; }
  .day-title { font-size: 21px; font-weight: 700; line-height: 1.2; }
  .habits { display: flex; flex-direction: column; gap: 8px; }
  .habit {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 12px 12px 14px; border-radius: 18px;
    background: color-mix(in srgb, var(--bg) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--bg) 14%, transparent);
    transition: background-color .2s, border-color .2s, transform .1s;
  }
  .habit:active { transform: scale(.985); }
  .habit[aria-pressed="true"] { background: color-mix(in srgb, var(--h) 26%, transparent); border-color: color-mix(in srgb, var(--h) 70%, transparent); }
  .h-icon { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .h-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .h-name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .h-streak { font-size: 12.5px; opacity: .72; }
  .check {
    width: 34px; height: 34px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center;
    border: 2px solid color-mix(in srgb, var(--bg) 35%, transparent); transition: background-color .2s, border-color .2s;
  }
  .check svg { width: 18px; height: 18px; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .25s cubic-bezier(.3,1.6,.5,1); }
  .habit[aria-pressed="true"] .check { background: var(--h); border-color: var(--h); }
  .habit[aria-pressed="true"] .check svg { opacity: 1; transform: none; }
  .day-foot { display: flex; align-items: center; gap: 12px; padding-top: 2px; }
  .ring { width: 44px; height: 44px; flex-shrink: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bgc { stroke: color-mix(in srgb, var(--bg) 18%, transparent); }
  .ring .fg { stroke: var(--sprout); stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
  .ring-wrap { position: relative; flex-shrink: 0; }
  .ring-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .cheer { font-size: 14.5px; line-height: 1.35; }
  .cheer.all { font-weight: 600; }
  .cheer.pop { animation: pop .5s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .to-today { align-self: center; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; opacity: .85; }
  .spark { position: fixed; pointer-events: none; font-size: 18px; z-index: 30; animation: fly 1s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--x), var(--y)) scale(.6); opacity: 0; } }

  /* sections */
  .section { display: flex; flex-direction: column; gap: 12px; }
  .section > h2 { font-size: 18px; font-weight: 700; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }

  /* dashboard */
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .sum { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .sum b { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.1; }
  .sum span { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .stats { display: flex; flex-direction: column; }
  .stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .stat + .stat { border-top: 1px solid var(--line); }
  .stat-top { display: flex; align-items: center; gap: 10px; }
  .stat-top .nm { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 999px; background: var(--h); flex-shrink: 0; }
  .fire { font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .fire.on { color: var(--flame); }
  .fire.off { color: var(--muted); font-weight: 500; font-size: 13px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat-grid div { display: flex; flex-direction: column; }
  .stat-grid b { font-size: 15px; }
  .stat-grid small { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--h) 16%, transparent); overflow: hidden; }
  .stat.goal .bar i { background: var(--sprout); }
  .stat.goal .stat-grid div:first-child b { color: var(--sprout); }
  .bar i { display: block; height: 100%; background: var(--h); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }

  /* overview */
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .ov { padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .ov-nav { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; text-align: center; }
  .ov-nav .nav { width: 36px; height: 36px; font-size: 20px; border: 1px solid var(--line); }
  .ov-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .week { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 32px); gap: 6px 4px; align-items: center; }
  .wk-h { text-align: center; font-size: 11px; color: var(--muted); line-height: 1.2; }
  .wk-h b { display: block; font-size: 13px; color: var(--ink); font-weight: 600; }
  .wk-h.is-today b { color: var(--sprout); }
  .wk-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .dot-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 999px; }
  .dot-btn i { width: 20px; height: 20px; border-radius: 999px; border: 2px solid color-mix(in srgb, var(--h) 40%, var(--line)); transition: background-color .15s, transform .2s; }
  .dot-btn[aria-pressed="true"] i { background: var(--h); border-color: var(--h); }
  .dot-btn:disabled i { border-style: dotted; }
  .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .mo-h { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
  .cell {
    aspect-ratio: 1 / 1.08; max-width: 100%; border-radius: 12px; padding: 4px 2px 5px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    border: 1px solid transparent; font-size: 12.5px; font-weight: 500;
  }
  .cell.is-today { border-color: var(--sprout); }
  .cell.is-sel { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .cell.all { background: color-mix(in srgb, var(--sprout) 16%, transparent); }
  .cell.all .dn { color: var(--sprout); font-weight: 700; }
  .cell.out { opacity: .35; }
  .cell .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 26px; }
  .cell .dots i { width: 7px; height: 7px; border-radius: 999px; background: color-mix(in srgb, var(--h) 20%, transparent); }
  .cell .dots i.on { background: var(--h); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .hint { font-size: 12.5px; color: var(--muted); }

  /* manage habits */
  .field {
    width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; color: var(--ink); font-size: 16px; outline: none;
  }
  .field:focus { border-color: var(--sprout); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sprout) 25%, transparent); }
  .field.icon { width: 52px; text-align: center; padding-inline: 4px; flex-shrink: 0; }
  .manage { padding: 6px 12px; display: flex; flex-direction: column; }
  .m-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; }
  .m-row + .m-row, .confirm { border-top: 1px solid var(--line); }
  .btn { border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .btn-main { background: var(--sprout); color: var(--sprout-ink); }
  .btn-quiet { border: 1px solid var(--line); font-weight: 500; }
  .btn-danger { color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
  .confirm { padding: 10px 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .confirm div { display: flex; gap: 8px; }
  .add { display: flex; gap: 8px; padding: 12px; border-top: 1px dashed var(--line); }
  .archived { padding: 4px 16px 12px; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  .archived .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .link { font-weight: 600; color: var(--sprout); text-decoration: underline; text-underline-offset: 3px; }

  /* backup */
  .backup { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .backup p { color: var(--muted); font-size: 14px; }
  .backup .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .backup .btns > * { text-align: center; padding: 11px 10px; }
  .backup label { cursor: pointer; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(28rem, calc(100% - 32px));
    background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px;
  }
  .toast button { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 370px) {
    .week { grid-template-columns: minmax(0, 1fr) repeat(7, 28px); }
    .dot-btn { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Min gode vaner ✨</h1>
      <p class="sub">Små handlinger tæller.</p>
    </div>
    <button id="theme-btn" class="theme-btn" type="button" aria-label="Skift mellem lyst og mørkt tema"></button>
  </header>

  <section class="day" aria-labelledby="day-title">
    <div class="day-head">
      <button id="prev-day" class="nav" type="button" aria-label="Forrige dag">‹</button>
      <div>
        <div id="day-kicker" class="kicker">I dag</div>
        <h2 id="day-title" class="day-title"></h2>
      </div>
      <button id="next-day" class="nav" type="button" aria-label="Næste dag">›</button>
    </div>
    <div id="habit-list" class="habits"></div>
    <div class="day-foot">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="bgc" cx="22" cy="22" r="18"></circle><circle id="ring-fg" class="fg" cx="22" cy="22" r="18"></circle></svg>
        <span id="ring-num" class="ring-num num"></span>
      </div>
      <p id="cheer" class="cheer" aria-live="polite"></p>
    </div>
    <button id="to-today" class="to-today" type="button" hidden>Tilbage til i dag</button>
  </section>

  <section class="section" aria-labelledby="dash-title">
    <h2 id="dash-title">Dashboard</h2>
    <div id="summary" class="summary"></div>
    <div id="stats" class="panel stats"></div>
  </section>

  <section class="section" aria-labelledby="ov-heading">
    <div class="sec-head">
      <h2 id="ov-heading">Oversigt</h2>
      <div class="seg" role="group" aria-label="Vis uge eller måned">
        <button id="v-week" type="button" aria-pressed="true">Uge</button>
        <button id="v-month" type="button" aria-pressed="false">Måned</button>
      </div>
    </div>
    <div class="panel ov">
      <div class="ov-nav">
        <button id="ov-prev" class="nav" type="button" aria-label="Forrige">‹</button>
        <div id="ov-title" class="ov-title"></div>
        <button id="ov-next" class="nav" type="button" aria-label="Næste">›</button>
      </div>
      <div id="ov-grid"></div>
      <div id="legend" class="legend"></div>
      <p id="ov-hint" class="hint"></p>
    </div>
  </section>

  <section class="section" aria-labelledby="manage-title">
    <h2 id="manage-title">Dine vaner</h2>
    <div class="panel">
      <div id="manage" class="manage"></div>
      <form id="add-form" class="add" autocomplete="off">
        <input id="add-icon" class="field icon" maxlength="4" placeholder="🌱" aria-label="Ikon til ny vane">
        <input id="add-name" class="field" placeholder="Ny vane, fx Gåtur" aria-label="Navn på ny vane" required>
        <button class="btn btn-main" type="submit">Tilføj</button>
      </form>
      <div id="archived" class="archived" hidden></div>
    </div>
  </section>

  <section class="section" aria-labelledby="backup-title">
    <h2 id="backup-title">Backup</h2>
    <div class="panel backup">
      <p>Dine vaner gemmes kun på denne telefon. Tag en backup en gang imellem, og gem filen i Filer eller send den til dig selv.</p>
      <div class="btns">
        <button id="backup-save" class="btn btn-main" type="button">Tag backup</button>
        <label for="backup-file" class="btn btn-quiet">Hent backup</label>
        <input id="backup-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="backup-info" class="num"></p>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" hidden>
  <span id="toast-msg"></span>
  <button id="toast-action" type="button" hidden></button>
</div>

<script>
(() => {
  const KEY = 'gode-vaner';
  const THEME_KEY = 'gode-vaner-tema';
  const LAST_BACKUP_KEY = 'gode-vaner-sidste-backup';
  const GOAL = 7; // målet er hver dag: 7 af 7 i ugen

  // Første gang appen åbnes: dine fire vaner, ingen flueben, og alt starter fra i dag
  function makeSeed() {
    const n = new Date();
    const start = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
    return {
      app: 'gode-vaner', version: 1, start,
      habits: [
        { id: 'meditation', name: 'Meditation', icon: '🧘', color: 0, created: start },
        { id: 'traening', name: 'Træning', icon: '🏃', color: 1, created: start },
        { id: 'visualisering', name: 'Visualisering', icon: '💭', color: 2, created: start },
        { id: 'mad', name: 'Sund / grøn mad', icon: '🥗', color: 3, created: start }
      ],
      checks: {}
    };
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- data ----------
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.app === 'gode-vaner' && Array.isArray(d.habits)) return d;
    } catch {}
    return makeSeed();
  }
  let data = load();
  let saveWarned = false;
  let toastTimer;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch { if (!saveWarned) { saveWarned = true; toast('Telefonen kunne ikke gemme. Tag en backup, så du ikke mister noget.'); } }
  }
  save();

  // ---------- dates (keys are local YYYY-MM-DD) ----------
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const add = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
  const addMonths = (k, n) => { const d = parse(k); return key(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
  const todayKey = () => key(new Date());
  const weekStart = k => { const d = parse(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return key(d); };
  const monthStart = k => k.slice(0, 8) + '01';
  const monthEnd = k => { const d = parse(k); return key(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
  const max = (a, b) => a > b ? a : b;
  const min = (a, b) => a < b ? a : b;
  const fmt = (k, opts) => parse(k).toLocaleDateString('da-DK', opts);
  const WD = ['ma', 'ti', 'on', 'to', 'fr', 'lø', 'sø'];

  // ---------- habit helpers ----------
  const active = () => data.habits.filter(h => !h.archived);
  const isDone = (id, k) => (data.checks[k] || []).includes(id);
  function setDone(id, k, on) {
    const list = (data.checks[k] || []).filter(x => x !== id);
    if (on) list.push(id);
    if (list.length) data.checks[k] = list; else delete data.checks[k];
    save();
  }
  // the app's first day: the day it was started, or an earlier tick from a backup
  function firstDay() {
    let s = data.start || todayKey();
    for (const k in data.checks) if (k < s) s = k;
    return s;
  }
  // a habit counts from the day it was added, or its earliest tick if that is before
  function effStart(h) {
    let s = h.created || firstDay();
    for (const k in data.checks) if (k < s && data.checks[k].includes(h.id)) s = k;
    return s;
  }
  function countRange(h, from, to) {
    from = max(from, effStart(h)); to = min(to, todayKey());
    let done = 0, days = 0;
    for (let k = from; k <= to; k = add(k, 1)) { days++; if (isDone(h.id, k)) done++; }
    return { done, days, pct: days ? Math.round(done / days * 100) : 0 };
  }
  function streak(h) {
    let k = todayKey();
    if (!isDone(h.id, k)) k = add(k, -1); // i dag er ikke slut endnu
    let n = 0;
    while (isDone(h.id, k)) { n++; k = add(k, -1); }
    return n;
  }
  function bestStreak(h) {
    let best = 0, run = 0;
    for (let k = effStart(h), t = todayKey(); k <= t; k = add(k, 1)) {
      run = isDone(h.id, k) ? run + 1 : 0; if (run > best) best = run;
    }
    return best;
  }
  // days ticked in the Monday–Sunday week that holds k, counted against the 7/7 goal
  function weekCount(h, k) {
    let n = 0;
    for (let i = 0, d = weekStart(k); i < 7; i++, d = add(d, 1)) if (isDone(h.id, d)) n++;
    return n;
  }
  const allDone = k => { const a = active(); return a.length > 0 && a.every(h => isDone(h.id, k)); };
  const hv = h => `--h:var(--c${h.color % 6})`;
  const dayWord = n => n === 1 ? 'dag' : 'dage';

  // ---------- state ----------
  let sel = todayKey();
  let view = 'week';
  let anchor = todayKey();

  // ---------- day card ----------
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ALL_TODAY = [
    n => `Alle ${n} vaner er klaret i dag. Sådan! 🌟`,
    () => 'Fuld plade i dag. Mærk lige efter, hvor godt det føles ✨',
    () => 'Du holdt alle dine løfter til dig selv i dag 💚',
    () => 'Små handlinger, stor dag. Alt er klaret 🌱'
  ];

  function cheerFor(k, done, total) {
    const isToday = k === todayKey();
    if (!total) return 'Tilføj en vane nedenfor for at komme i gang.';
    if (done === total) {
      if (!isToday) return 'Alle vaner klaret den dag 🌟';
      const i = [...k].reduce((a, c) => a + c.charCodeAt(0), 0) % ALL_TODAY.length;
      return ALL_TODAY[i](total);
    }
    if (done === 0) return isToday ? 'Tryk på en vane, når du har gjort den.' : 'Ingen flueben den dag. Tryk, hvis du har glemt at sætte dem.';
    if (total - done === 1) return isToday ? 'Kun én vane tilbage i dag 🌱' : `${done} af ${total} klaret den dag.`;
    if (done === 1) return isToday ? 'Godt begyndt. Én vane er klaret.' : `1 af ${total} klaret den dag.`;
    return `${done} af ${total} klaret. Hver lille handling tæller.`;
  }

  function renderDay(celebrate) {
    const t = todayKey();
    const habits = active();
    $('day-kicker').textContent = sel === t ? 'I dag' : sel === add(t, -1) ? 'I går' : fmt(sel, { weekday: 'long' });
    const sameYear = sel.slice(0, 4) === t.slice(0, 4);
    $('day-title').textContent = sel === t || sel === add(t, -1)
      ? fmt(sel, { weekday: 'long', day: 'numeric', month: 'long' })
      : fmt(sel, sameYear ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' });
    $('next-day').disabled = sel >= t;
    $('prev-day').disabled = sel <= firstDay();
    $('to-today').hidden = sel === t;

    $('habit-list').innerHTML = habits.map(h => {
      const on = isDone(h.id, sel);
      const s = streak(h), wc = weekCount(h, sel);
      const sub = (s ? `🔥 ${s} ${dayWord(s)} i træk · ` : '') + (wc >= GOAL ? `${GOAL}/${GOAL} i ugen 🎉` : `${wc}/${GOAL} i ugen`);
      return `<button type="button" class="habit" data-id="${esc(h.id)}" aria-pressed="${on}" style="--h:var(--d${h.color % 6})">
        <span class="h-icon" aria-hidden="true">${esc(h.icon || '•')}</span>
        <span class="h-text"><span class="h-name">${esc(h.name)}</span><span class="h-streak">${sub}</span></span>
        <span class="check">${CHECK}</span></button>`;
    }).join('');

    const done = habits.filter(h => isDone(h.id, sel)).length;
    const C = 2 * Math.PI * 18;
    const ring = $('ring-fg');
    ring.style.strokeDasharray = C;
    ring.style.strokeDashoffset = C * (1 - (habits.length ? done / habits.length : 0));
    $('ring-num').textContent = `${done}/${habits.length}`;
    const cheer = $('cheer');
    cheer.textContent = cheerFor(sel, done, habits.length);
    cheer.className = 'cheer' + (habits.length && done === habits.length ? ' all' : '');
    if (celebrate) { void cheer.offsetWidth; cheer.classList.add('pop'); }
  }

  function sparkle(from) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = from.getBoundingClientRect();
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('span');
      s.className = 'spark'; s.textContent = ['✨', '🌟', '💚'][i % 3];
      s.style.left = r.left + r.width / 2 + 'px'; s.style.top = r.top + r.height / 2 + 'px';
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 70;
      s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d - 30 + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
  }

  $('habit-list').addEventListener('click', e => {
    const b = e.target.closest('.habit'); if (!b) return;
    const id = b.dataset.id;
    const was = allDone(sel);
    setDone(id, sel, !isDone(id, sel));
    const now = allDone(sel);
    renderAll(now && !was);
    if (now && !was) sparkle($('ring-num'));
  });
  $('prev-day').addEventListener('click', () => { if (sel > firstDay()) { sel = add(sel, -1); syncAnchor(); renderAll(); } });
  $('next-day').addEventListener('click', () => { if (sel < todayKey()) { sel = add(sel, 1); syncAnchor(); renderAll(); } });
  $('to-today').addEventListener('click', () => { sel = todayKey(); syncAnchor(); renderAll(); });
  // keep the overview showing the chosen day
  function syncAnchor() {
    if (view === 'week' && weekStart(sel) !== weekStart(anchor)) anchor = sel;
    if (view === 'month' && monthStart(sel) !== monthStart(anchor)) anchor = sel;
  }

  // ---------- dashboard ----------
  function renderDash() {
    const t = todayKey(), ws = weekStart(t), ms = monthStart(t), me = monthEnd(t);
    const habits = active();
    let weekTicks = 0;
    for (let k = ws; k <= t; k = add(k, 1)) weekTicks += habits.filter(h => isDone(h.id, k)).length;
    let fullDays = 0;
    for (let k = ms; k <= t; k = add(k, 1)) if (allDone(k)) fullDays++;
    const bestNow = habits.reduce((m, h) => Math.max(m, streak(h)), 0);
    $('summary').innerHTML = `
      <div class="sum"><b class="num">${weekTicks}</b><span>af ${GOAL * habits.length} flueben i denne uge</span></div>
      <div class="sum"><b class="num">${fullDays}</b><span>${fullDays === 1 ? 'dag' : 'dage'} med alle vaner i ${fmt(t, { month: 'long' })}</span></div>
      <div class="sum"><b class="num">${bestNow ? '🔥 ' + bestNow : '0'}</b><span>længste streak lige nu</span></div>`;

    $('stats').innerHTML = habits.length ? habits.map(h => {
      const s = streak(h), wc = weekCount(h, t), m = countRange(h, ms, me), b = bestStreak(h);
      const wp = Math.round(Math.min(wc, GOAL) / GOAL * 100), goal = wc >= GOAL;
      return `<div class="stat${goal ? ' goal' : ''}" style="${hv(h)}">
        <div class="stat-top">
          <span class="swatch" aria-hidden="true"></span>
          <span class="nm">${esc(h.icon || '')} ${esc(h.name)}</span>
          ${s ? `<span class="fire on num">🔥 ${s} ${dayWord(s)}</span>` : '<span class="fire off">Ingen streak</span>'}
        </div>
        <div class="stat-grid num">
          <div><b>${goal ? `${GOAL}/${GOAL} 🎉` : `${wc} af ${GOAL}`}</b><small>${goal ? 'ugens mål er nået' : `ugens mål · ${wp}%`}</small></div>
          <div><b>${m.done} af ${m.days}</b><small>dage i måneden · ${m.pct}%</small></div>
          <div><b>${b} ${dayWord(b)}</b><small>bedste streak</small></div>
        </div>
        <div class="bar" role="img" aria-label="${wc} af ${GOAL} dage i denne uge"><i style="width:${wp}%"></i></div>
      </div>`;
    }).join('') : '<div class="stat"><span class="hint">Du har ingen vaner endnu. Tilføj en nedenfor.</span></div>';
  }

  // ---------- overview ----------
  function renderOverview() {
    const t = todayKey(), f = firstDay();
    const habits = active();
    $('v-week').setAttribute('aria-pressed', view === 'week');
    $('v-month').setAttribute('aria-pressed', view === 'month');
    const grid = $('ov-grid');

    if (view === 'week') {
      const ws = weekStart(anchor), we = add(ws, 6);
      const sm = ws.slice(5, 7) === we.slice(5, 7);
      $('ov-title').textContent = ws === weekStart(t) ? 'Denne uge'
        : `${fmt(ws, sm ? { day: 'numeric' } : { day: 'numeric', month: 'short' })}–${fmt(we, { day: 'numeric', month: 'short' })}`;
      $('ov-next').disabled = ws >= weekStart(t);
      $('ov-prev').disabled = ws <= weekStart(f);
      const days = [...Array(7)].map((_, i) => add(ws, i));
      let html = '<div></div>' + days.map((k, i) =>
        `<div class="wk-h${k === t ? ' is-today' : ''}">${WD[i]}<b class="num">${parse(k).getDate()}</b></div>`).join('');
      for (const h of habits) {
        html += `<div class="wk-name" title="${esc(h.name)}"><span aria-hidden="true">${esc(h.icon || '•')}</span>${esc(h.name)}</div>`;
        html += days.map(k => {
          const on = isDone(h.id, k);
          return `<button type="button" class="dot-btn" style="${hv(h)}" data-id="${esc(h.id)}" data-k="${k}" aria-pressed="${on}" ${k > t || k < f ? 'disabled' : ''} aria-label="${esc(h.name)}, ${fmt(k, { weekday: 'long', day: 'numeric', month: 'long' })}"><i></i></button>`;
        }).join('');
      }
      grid.className = 'week';
      grid.innerHTML = html;
      $('legend').hidden = true;
      $('ov-hint').textContent = 'Tryk på en prik for at sætte eller fjerne et flueben.';
    } else {
      const ms = monthStart(anchor), me = monthEnd(anchor);
      const title = fmt(ms, { month: 'long', year: 'numeric' });
      $('ov-title').textContent = title.charAt(0).toUpperCase() + title.slice(1);
      $('ov-next').disabled = ms >= monthStart(t);
      $('ov-prev').disabled = ms <= monthStart(f);
      let html = WD.map(d => `<div class="mo-h">${d}</div>`).join('');
      const lead = (parse(ms).getDay() + 6) % 7;
      html += '<div></div>'.repeat(lead);
      for (let k = ms; k <= me; k = add(k, 1)) {
        const out = k > t || k < f;
        const cls = ['cell', k === t && 'is-today', k === sel && 'is-sel', !out && allDone(k) && 'all', out && 'out'].filter(Boolean).join(' ');
        const dots = habits.map(h => `<i class="${isDone(h.id, k) ? 'on' : ''}" style="${hv(h)}"></i>`).join('');
        const n = habits.filter(h => isDone(h.id, k)).length;
        html += `<button type="button" class="${cls}" data-k="${k}" ${out ? 'disabled' : ''} aria-label="${fmt(k, { weekday: 'long', day: 'numeric', month: 'long' })}: ${n} af ${habits.length}"><span class="dn num">${parse(k).getDate()}</span><span class="dots">${dots}</span></button>`;
      }
      grid.className = 'month';
      grid.innerHTML = html;
      $('legend').hidden = false;
      $('legend').innerHTML = habits.map(h => `<span style="${hv(h)}"><i class="swatch"></i>${esc(h.name)}</span>`).join('');
      $('ov-hint').textContent = 'Grønne dage er dage, hvor alle vaner er klaret. Tryk på en dag for at åbne den øverst.';
    }
  }

  $('ov-grid').addEventListener('click', e => {
    const dot = e.target.closest('.dot-btn');
    if (dot) {
      const { id, k } = dot.dataset;
      const was = allDone(k);
      setDone(id, k, !isDone(id, k));
      renderAll(k === sel && allDone(k) && !was);
      return;
    }
    const cell = e.target.closest('.cell');
    if (cell) {
      sel = cell.dataset.k;
      renderAll();
      document.querySelector('.day').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  $('v-week').addEventListener('click', () => { view = 'week'; anchor = sel; renderOverview(); });
  $('v-month').addEventListener('click', () => { view = 'month'; anchor = sel; renderOverview(); });
  $('ov-prev').addEventListener('click', () => { anchor = view === 'week' ? add(weekStart(anchor), -7) : addMonths(anchor, -1); renderOverview(); });
  $('ov-next').addEventListener('click', () => { anchor = view === 'week' ? add(weekStart(anchor), 7) : addMonths(anchor, 1); renderOverview(); });

  // ---------- manage habits ----------
  let confirming = null;
  function renderManage() {
    const habits = active();
    $('manage').innerHTML = habits.map(h => confirming === h.id
      ? `<div class="confirm" data-id="${esc(h.id)}">
          <span>Fjern <b>${esc(h.name)}</b>? Dine gamle flueben bliver gemt, så du kan hente vanen tilbage.</span>
          <div><button type="button" class="btn btn-danger" data-act="remove">Fjern</button><button type="button" class="btn btn-quiet" data-act="keep">Behold</button></div>
        </div>`
      : `<div class="m-row" data-id="${esc(h.id)}">
          <input class="field icon" data-f="icon" maxlength="4" value="${esc(h.icon || '')}" aria-label="Ikon for ${esc(h.name)}">
          <input class="field" data-f="name" value="${esc(h.name)}" aria-label="Navn på vane">
          <button type="button" class="btn btn-quiet" data-act="ask">Fjern</button>
        </div>`).join('') || '<p class="hint" style="padding:10px 4px">Ingen vaner endnu.</p>';

    const gone = data.habits.filter(h => h.archived);
    $('archived').hidden = !gone.length;
    $('archived').innerHTML = gone.length ? '<span class="label">Fjernede vaner</span>' + gone.map(h =>
      `<div class="row"><span>${esc(h.icon || '')} ${esc(h.name)}</span><button type="button" class="link" data-restore="${esc(h.id)}">Hent tilbage</button></div>`).join('') : '';
  }

  $('manage').addEventListener('change', e => {
    const inp = e.target.closest('input[data-f]'); if (!inp) return;
    const h = data.habits.find(x => x.id === inp.closest('[data-id]').dataset.id); if (!h) return;
    const v = inp.value.trim();
    if (inp.dataset.f === 'name') { if (!v) { inp.value = h.name; return; } h.name = v; }
    else h.icon = v;
    save(); renderDay(); renderDash(); renderOverview();
    toast('Gemt');
  });
  $('manage').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.closest('[data-id]').dataset.id;
    const h = data.habits.find(x => x.id === id);
    if (b.dataset.act === 'ask') confirming = id;
    else if (b.dataset.act === 'keep') confirming = null;
    else if (b.dataset.act === 'remove' && h) {
      h.archived = true; confirming = null; save();
      toast(`${h.name} er fjernet`, 'Fortryd', () => { h.archived = false; save(); renderAll(); });
    }
    renderAll();
  });
  $('archived').addEventListener('click', e => {
    const b = e.target.closest('[data-restore]'); if (!b) return;
    const h = data.habits.find(x => x.id === b.dataset.restore);
    if (h) { h.archived = false; save(); renderAll(); toast(`${h.name} er tilbage`); }
  });
  $('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('add-name').value.trim(); if (!name) return;
    const used = active().map(h => h.color % 6);
    let color = [0, 1, 2, 3, 4, 5].find(c => !used.includes(c));
    if (color === undefined) color = data.habits.length % 6;
    data.habits.push({ id: 'v' + Date.now().toString(36), name, icon: $('add-icon').value.trim() || '🌱', color, created: todayKey() });
    save();
    $('add-name').value = ''; $('add-icon').value = '';
    renderAll();
    toast(`${name} er tilføjet`);
  });

  // ---------- backup ----------
  function renderBackupInfo() {
    let last = null;
    try { last = Number(localStorage.getItem(LAST_BACKUP_KEY)) || null; } catch {}
    $('backup-info').textContent = last
      ? `Sidste backup: ${new Date(last).toLocaleDateString('da-DK', { day: 'numeric', month: 'long', year: 'numeric' })}`
      : 'Du har ikke taget en backup endnu.';
  }
  $('backup-save').addEventListener('click', async () => {
    const json = JSON.stringify({ ...data, exported: new Date().toISOString() }, null, 2);
    const name = `gode-vaner-backup-${todayKey()}.json`;
    const file = new File([json], name, { type: 'application/json' });
    const done = msg => { try { localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); } catch {} renderBackupInfo(); toast(msg); };
    try {
      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Gode vaner backup' });
        return done('Backup klar. Vælg "Gem i Filer" eller send den til dig selv.');
      }
    } catch (err) { if (err?.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(file);
      const a = Object.assign(document.createElement('a'), { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      done('Backup gemt.');
    } catch { toast('Backup virker ikke her. Prøv i appen på telefonen.'); }
  });
  $('backup-file').addEventListener('change', async e => {
    const f = e.target.files?.[0]; e.target.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'gode-vaner' || !Array.isArray(d.habits) || typeof d.checks !== 'object') throw new Error('format');
      const before = data;
      delete d.exported;
      if (!d.start) d.start = Object.keys(d.checks).sort()[0] || todayKey();
      data = d; save(); sel = todayKey(); anchor = sel; renderAll();
      toast('Backup hentet', 'Fortryd', () => { data = before; save(); renderAll(); });
    } catch {
      toast('Filen er ikke en backup fra Min gode vaner.');
    }
  });

  // ---------- toast ----------
  function toast(msg, actionLabel, action) {
    $('toast-msg').textContent = msg;
    const b = $('toast-action');
    b.hidden = !actionLabel; b.textContent = actionLabel || '';
    b.onclick = () => { $('toast').hidden = true; action?.(); };
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, actionLabel ? 6000 : 2600);
  }

  // ---------- theme ----------
  const THEMES = { auto: 'Tema: auto', light: 'Tema: lyst', dark: 'Tema: mørkt' };
  let theme = 'auto';
  try { theme = localStorage.getItem(THEME_KEY) || 'auto'; } catch {}
  function applyTheme(touch) {
    if (theme === 'auto') { if (touch) document.documentElement.removeAttribute('data-theme'); }
    else document.documentElement.setAttribute('data-theme', theme);
    $('theme-btn').textContent = (theme === 'dark' ? '🌙 ' : theme === 'light' ? '☀️ ' : '◐ ') + THEMES[theme];
  }
  $('theme-btn').addEventListener('click', () => {
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
    applyTheme(true);
  });
  applyTheme(false);

  // ---------- render ----------
  function renderAll(celebrate) {
    renderDay(celebrate); renderDash(); renderOverview(); renderManage(); renderBackupInfo();
  }
  // when the app is opened again on a new day, jump to the new "today"
  let lastToday = todayKey();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = todayKey();
    if (t !== lastToday) { if (sel === lastToday) sel = t; anchor = sel; lastToday = t; renderAll(); }
  });
  renderAll();
})();
</script>

<script>
  // Virker uden internet
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  // Bed telefonen om ikke at rydde appens data af sig selv
  navigator.storage?.persist?.().catch(() => {});
</script>
</body>
</html>
